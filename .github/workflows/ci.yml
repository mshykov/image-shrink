# Builds the app and runs the smoke test on every pull request.
name: ci

# No path filter. `build` is a required check, and a pull request that touches only docs never
# fires a filtered workflow — so the check stays pending and the pull request can never merge.
# Two minutes on every pull request is the cheaper half of that trade.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's older run is worth cancelling; a run on main is the record of that commit,
# and cancelling it leaves the branch looking broken. Keeping the event in the group also stops
# a manual dispatch from killing the push run for the same commit.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: What this runner has
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          xcodebuild -version
          xcrun --show-sdk-version

      # The window uses macOS 26 APIs behind #available, so it needs that SDK to compile at all.
      - name: Pick the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$newest" ] && sudo xcode-select -s "$newest"
          xcodebuild -version

      # Built with Sparkle, because that is the shape a release has. Without this the build
      # compiles the no-updater branch and CI would never exercise the one that ships.
      - name: Sparkle
        run: ./scripts/fetch-sparkle.sh

      - name: Build
        run: ./scripts/build.sh

      - name: The bundle is put together the way it will ship
        run: |
          app="build/Image Shrink.app"
          codesign --verify --deep --strict "$app"
          test -d "$app/Contents/Frameworks/Sparkle.framework" || { echo "Sparkle is not embedded"; exit 1; }
          count=$(ls -d "$app/Contents/Resources/Services"/*.workflow | wc -l | tr -d ' ')
          [ "$count" = "5" ] || { echo "expected 5 Quick Actions, found $count"; exit 1; }

      - name: Smoke test
        run: ./scripts/smoke-test.sh
