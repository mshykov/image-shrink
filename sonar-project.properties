# SonarCloud runs in automatic-analysis mode on this repository — there is no scan workflow and
# no token. This file exists so the wiring is visible in the repo rather than only in a web UI,
# and so the exclusions travel with a fork.
sonar.projectKey=mshykov_image-shrink
sonar.organization=mshykov

sonar.sources=.
# build/ is generated and never committed; the two directories below are content, not code —
# the landing page's markup and the screenshots it shows.
sonar.exclusions=build/**,site/*.png,site/*.ico,site/*.svg,docs/**
